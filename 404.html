<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deevoro</title><meta name="robots" content="noindex">
<script>
var PAGINAS = ["restaurantes","apuntate","club","condiciones","privacidad","eliminar-cuenta","condiciones-comercio","condiciones-club"];
var ALIAS = {"restaurante":"restaurantes","restaurants":"restaurantes","restaurant":"restaurantes","bares":"restaurantes","bar":"restaurantes","comercios":"restaurantes","locales":"restaurantes","apuntarse":"apuntate","apuntame":"apuntate","registro":"apuntate","registrate":"apuntate","alta":"apuntate","terminos":"condiciones","politica-de-privacidad":"privacidad"};
function destinoWeb(ruta) {
  let p = String(ruta || '');
  try { p = decodeURIComponent(p); } catch (e) { /* se queda como venía */ }
  p = p.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  p = p.replace(/^\/+|\/+$/g, '').replace(/\.html?$/, '').trim();
  if (Object.prototype.hasOwnProperty.call(ALIAS, p)) p = ALIAS[p];
  return PAGINAS.indexOf(p) >= 0 ? '/' + p : null;
}
var destino = destinoWeb(location.pathname);
if (destino) location.replace(destino + location.search + location.hash);
</script>
<style>
:root{--rojo:#E32D28;--tinta:#1C1617;--gris:#5E5557;--fondo:#FFF7F6}
@media (prefers-color-scheme:dark){:root{--tinta:#F6EEED;--gris:#C9BDBB;--fondo:#1A1415}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--fondo);color:var(--tinta);font:17px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:24px 16px}
main{max-width:420px;text-align:center}
h1{font-size:26px;margin:0 0 8px}
p{color:var(--gris);margin:0 0 22px}
nav{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a{display:inline-block;padding:12px 20px;border-radius:999px;font-weight:700;text-decoration:none;background:var(--rojo);color:#fff}
a.sec{background:transparent;color:var(--rojo);border:2px solid var(--rojo)}
a:focus-visible{outline:3px solid var(--tinta);outline-offset:3px}
</style></head>
<body><main>
<h1>No encontramos esta página</h1>
<p>Puede que la dirección esté mal escrita.</p>
<nav><a href="/">Ir a Deevoro</a><a class="sec" href="/restaurantes">Soy un restaurante</a></nav>
</main></body></html>
